<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="포켓몬스터 암브로시아 한글판 공략 위키와 한글 패치"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>암브로시아 한글 위키</title>
<style>
@font-face { font-family: "Galmuri9"; src: url("galmuri9.woff2") format("woff2"); font-display: swap; }
:root {
  --bg: #f5efe3; --surface: #fffcf5; --surface2: #f0e8d8; --ink: #2a241c; --muted: #6e6455;
  --line: #e2d7c3; --accent: #a8432a; --accent-ink: #fff; --gold: #c99a1c; --link: #8a3520;
  --good: #3f8f4f; --bad: #b8432f; --shadow: 0 1px 0 rgba(60,40,10,.06), 0 6px 18px -10px rgba(60,40,10,.25);
  --pixel: "Galmuri9", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130e; --surface: #201c15; --surface2: #2a251c; --ink: #efe7d6; --muted: #a89d8a;
    --line: #3a3326; --accent: #e07a52; --accent-ink: #1b140c; --gold: #e3b43c; --link: #f0a07c;
    --good: #6cc07a; --bad: #ef7a62; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16130e; --surface: #201c15; --surface2: #2a251c; --ink: #efe7d6; --muted: #a89d8a;
  --line: #3a3326; --accent: #e07a52; --accent-ink: #1b140c; --gold: #e3b43c; --link: #f0a07c;
  --good: #6cc07a; --bad: #ef7a62; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, .px { font-family: var(--pixel); font-weight: normal; letter-spacing: 0; }
h1 { font-size: 26px; line-height: 1.3; margin: 0; }
h2 { font-size: 19px; margin: 28px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 14px; height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); font-family: var(--pixel); font-size: 17px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .ball { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(var(--accent) 0 46%, var(--ink) 46% 54%, var(--surface) 54%); border: 2px solid var(--ink); position: relative; }
.brand .ball::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
nav.main { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav.main::-webkit-scrollbar { display: none; }
nav.main a { padding: 6px 10px; border-radius: 8px; color: var(--muted); white-space: nowrap; font-size: 14px; }
nav.main a:hover { background: var(--surface2); color: var(--ink); text-decoration: none; }
nav.main a.on { background: var(--ink); color: var(--bg); }
.back-btn { flex: none; display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 12px 0 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; white-space: nowrap; }
.back-btn:hover { border-color: var(--accent); }
.back-btn[hidden] { display: none; }
.back-btn svg { width: 16px; height: 16px; }
.theme-btn { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 15px; }
:root { --head-h: 57px; }
nav.main { position: relative; }
@media (max-width: 640px) {
  .topbar { height: auto; flex-wrap: wrap; padding: 8px 0 4px; gap: 6px 10px; }
  /* the tabs scroll sideways edge to edge; the fades show there is more */
  nav.main { order: 3; flex-basis: calc(100% + 32px); margin: 0 -16px; padding: 0 16px 4px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 30px), transparent);
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 30px), transparent); }
}
main.wrap { padding-top: 34px; padding-bottom: 64px; min-height: 70vh; } /* .wrap sets the side padding */
@media (max-width: 640px) { main.wrap { padding-top: 22px; } }
#app > h1 { margin: 0 0 14px; }
/* in-page jumps land below the sticky header, whatever its height */
[id] { scroll-margin-top: calc(var(--head-h) + 14px); }
/* keep running text to a readable line length on wide screens */
.wsteps p, .wchap > p, .faq details p, section.card > p, .wtips li { max-width: 72ch; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 20px 0 40px; }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grid { display: grid; gap: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; line-height: 20px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); white-space: nowrap; }
.tag { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); line-height: 20px; }
.tag.gold { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--ink); }
.type { display: inline-block; min-width: 46px; text-align: center; padding: 0 8px; border-radius: 6px; font-size: 12px; line-height: 21px; color: #fff; font-weight: 600; text-shadow: 0 1px 0 rgba(0,0,0,.25); white-space: nowrap; }
.type.lg { font-size: 14px; line-height: 26px; min-width: 60px; padding: 0 12px; }
.t-NORMAL{background:#9b9a78}.t-FIGHTING{background:#b9442f}.t-FLYING{background:#8b8fdb}.t-POISON{background:#9a4aa1}
.t-GROUND{background:#c49a45}.t-ROCK{background:#a68e3a}.t-FAIRY{background:#d77aa6}.t-BUG{background:#8b9e26}
.t-GHOST{background:#695a9c}.t-STEEL{background:#8a92a6}.t-FIRE{background:#e2702c}.t-WATER{background:#4c83d6}
.t-GRASS{background:#55a345}.t-ELECTRIC{background:#e0b11a;color:#2a2000;text-shadow:none}.t-PSYCHIC_TYPE{background:#e0527b}
.t-ICE{background:#63c2c2;color:#062a2a;text-shadow:none}.t-DRAGON{background:#5944d4}.t-DARK{background:#5a4a3d}
.t-UBER{background:linear-gradient(135deg,#c4921c,#8a2fc2)}
.cat { font-size: 12px; padding: 0 7px; border-radius: 6px; line-height: 21px; display: inline-block; border: 1px solid var(--line); }
.cat-물리 { background: color-mix(in srgb, #e2702c 18%, transparent); }
.cat-특수 { background: color-mix(in srgb, #4c83d6 18%, transparent); }
.cat-변화 { background: color-mix(in srgb, #9b9a78 22%, transparent); }

/* sprite */
.spr { display: inline-block; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; flex: none; }

/* forms */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
input[type=search], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; min-width: 0; }
input[type=search] { flex: 1 1 220px; }
input[type=search]:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .typebtn { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 12px; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.typebtn { padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; opacity: .45; }
.typebtn.on { opacity: 1; border-color: var(--ink); }
.typebtn .type { display: block; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }

/* dex grid */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.mon { display: flex; flex-direction: column; align-items: center; padding: 10px 8px 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.mon:hover { text-decoration: none; transform: translateY(-2px); border-color: var(--accent); }
.mon .no { font-family: var(--pixel); color: var(--muted); font-size: 12px; align-self: flex-start; }
.mon .nm { font-family: var(--pixel); font-size: 15px; margin: 2px 0 6px; text-align: center; }
.mon .ts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.mon .ts .type { min-width: 0; font-size: 11px; line-height: 18px; padding: 0 6px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface2); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrapc { white-space: normal; min-width: 220px; color: var(--muted); font-size: 13px; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.monlink { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }

/* detail */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.hero .art { width: 168px; height: 168px; border-radius: 18px; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, var(--surface2), transparent 70%); position: relative; }
.hero .art .spr { transition: opacity .15s; }
.shiny-btn { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 12px; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); padding: 2px 10px; white-space: nowrap; }
.shiny-btn.on { background: var(--gold); color: #241a00; border-color: var(--gold); }
.hero .no { font-family: var(--pixel); color: var(--muted); }
.hero h1 { font-size: 32px; }
.hero .en { color: var(--muted); margin-left: 6px; font-size: 15px; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .hero .meta-row { justify-content: center; } }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.ability { border-left: 4px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
.ability .lbl { font-family: var(--pixel); font-size: 13px; color: var(--muted); }
.ability p { margin: 4px 0 0; font-size: 16px; }
.stat { display: grid; grid-template-columns: 64px 36px 1fr; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.stat .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar { height: 10px; border-radius: 6px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.eff { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: start; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.eff:last-child { border-bottom: 0; }
.eff b { font-family: var(--pixel); font-weight: normal; font-size: 14px; }
.eff .list { display: flex; flex-wrap: wrap; gap: 4px; }
.evo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.evo-node { display: flex; flex-direction: column; align-items: center; padding: 6px 8px; border-radius: 12px; color: var(--ink); min-width: 80px; }
.evo-node.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.evo-node span.n { font-family: var(--pixel); font-size: 13px; }
.evo-arrow { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 12px; min-width: 70px; text-align: center; }
.evo-arrow::before { content: "→"; font-size: 18px; line-height: 1; color: var(--accent); }
.evo-branch { display: flex; flex-direction: column; gap: 4px; }
.evo-branch > div { display: flex; align-items: center; gap: 4px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.pager a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }

/* home */
.welcome { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: stretch; }
@media (max-width: 820px) { .welcome { grid-template-columns: 1fr; } }
.welcome > *, .cols > * { min-width: 0; }
.welcome .intro { padding: 26px; background: linear-gradient(160deg, color-mix(in srgb, var(--gold) 18%, var(--surface)), var(--surface) 60%); }
.welcome .intro h1 { font-size: 30px; margin-bottom: 10px; }
.welcome .intro p { margin: 0 0 10px; }
.parade { display: flex; gap: 0; margin: 14px -4px 0; overflow: hidden; height: 64px; }
.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.steps li::before { content: counter(s); font-family: var(--pixel); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--bg); }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: 14px; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.quick a { display: block; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow); }
.quick a:hover { border-color: var(--accent); text-decoration: none; }
.quick a b { font-family: var(--pixel); font-weight: normal; font-size: 16px; display: block; }
.quick a span { color: var(--muted); font-size: 13px; }
.features { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.features ul { margin: 0; padding-left: 18px; }
.features li { margin: 4px 0; font-size: 14px; }
.results { display: grid; gap: 4px; margin-top: 10px; }
.results a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
.results a:hover { border-color: var(--accent); text-decoration: none; }
.results .kind { font-size: 12px; color: var(--muted); margin-left: auto; }

/* trainers & places */
.trainers { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
@media (max-width: 380px) { .trainers { grid-template-columns: 1fr; } }
.tr-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tr-head b { font-family: var(--pixel); font-weight: normal; font-size: 17px; }
.team { display: grid; gap: 6px; margin-top: 10px; }
.team-mon { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 10px; background: var(--surface2); }
.team-mon .moves { font-size: 12px; color: var(--muted); line-height: 1.45; }
.team-mon .top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.team-mon .top a { color: var(--ink); font-weight: 600; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.place-sub { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.place-sub:last-child { border-bottom: 0; }
.mini-mons { display: flex; flex-wrap: wrap; gap: 0; margin-top: 8px; }

/* type chart */
.chart { width: auto; }
.chart td, .chart th { padding: 0; text-align: center; border: 1px solid var(--line); }
.chart th { position: sticky; background: var(--surface2); }
.chart thead th { top: 0; z-index: 2; height: 74px; vertical-align: bottom; padding-bottom: 4px; }
.chart thead th .type { writing-mode: vertical-rl; min-width: 0; padding: 6px 0; width: 22px; line-height: 22px; }
.chart tbody th { left: 0; z-index: 1; padding: 2px 4px; text-align: right; }
.chart td { width: 32px; height: 30px; font-weight: 700; font-size: 13px; }
.chart td.x2 { background: color-mix(in srgb, var(--good) 30%, transparent); }
.chart td.x05 { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.chart td.x0 { background: var(--ink); color: var(--bg); }
.chart td.xn { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--muted); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin: 10px 0; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.loading { display: grid; place-items: center; min-height: 50vh; color: var(--muted); font-family: var(--pixel); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.stage { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); white-space: nowrap; }
.stage b { font-weight: 700; color: var(--accent); }
.patch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.patch-btn { display: inline-block; font-weight: 600; padding: 7px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); text-decoration: none; }
.patch-btn:hover { color: var(--bg); opacity: .9; }
.patch-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.crumb { margin: 0 0 2px; font-size: 13px; }
.crumb a { color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.toc a { font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.faq details { border-bottom: 1px solid var(--line); padding: 10px 2px; }
.faq details:last-child { border-bottom: 0; }
.faq summary { color: var(--ink); font-size: 15px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; color: var(--muted); font-weight: 400; }
.faq details[open] summary::after { content: "−"; }
.faq p { margin: 8px 0 2px; color: var(--muted); font-size: 14px; }
.gyms { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 380px) { .gyms, .picks, .teamgrid { grid-template-columns: 1fr !important; } }
.gym h3 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gym .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0; font-size: 13px; }
.gym .row > span:first-child { color: var(--muted); min-width: 52px; }
.gym p { margin: 8px 0 0; font-size: 14px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.pick { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.pick .nm { font-family: var(--pixel); font-size: 16px; color: var(--ink); }
.pick p { margin: 4px 0; font-size: 14px; }
.pick .how { font-size: 13px; color: var(--muted); }
.team { margin-bottom: 14px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; margin-top: 12px; }
.tm { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 12px; background: var(--surface2); }
.tm .role { font-size: 12px; color: var(--muted); }
.tm .nm { font-weight: 600; color: var(--ink); }
.tm .how { font-size: 13px; }
.capt td, .capt th { text-align: center; }
.chg { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 14px; }
.chg + .chg { margin-top: 10px; }
.chg .nm { font-family: var(--pixel); font-size: 17px; color: var(--ink); }
@media (max-width: 480px) {
  .chg { grid-template-columns: 44px 1fr; gap: 8px; padding: 12px 10px; }
  .chg > a .spr { zoom: .62; }
  .st6 { gap: 3px; }
  .st6 div { padding: 3px 1px; font-size: 11px; letter-spacing: -.02em; }
  .st6 div span { white-space: nowrap; font-size: 10px; }
}
.st6 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 8px 0; max-width: 520px; }
.st6 div { background: var(--surface2); border-radius: 8px; padding: 3px 4px; text-align: center; font-size: 12px; line-height: 1.35; }
.st6 div b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.st6 .up { background: color-mix(in srgb, var(--good) 22%, transparent); }
.st6 .dn { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.st6 i { font-style: normal; font-size: 11px; color: var(--muted); }
.st6 .up i { color: var(--good); } .st6 .dn i { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .chip { font-size: 12px; }
.chip.new { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.chip.own { background: color-mix(in srgb, var(--gold) 26%, var(--surface)); }
.lbl2 { font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
.strike { text-decoration: line-through; opacity: .55; }
.wchap { padding: 18px; margin-bottom: 14px; }
.wchap h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wchap h2 .num { font-size: 13px; color: var(--accent); }
.wsteps { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: w; }
.wsteps > li { counter-increment: w; position: relative; padding: 0 0 14px 38px; }
.wsteps > li::before { content: counter(w); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--pixel); font-size: 13px; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.wsteps > li::after { content: ""; position: absolute; left: 13px; top: 28px; bottom: 2px; border-left: 1px dashed var(--line); }
.wsteps > li:last-child::after { display: none; }
.wsteps p { margin: 2px 0 6px; }
.wbits { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wbattle { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 10px; border-radius: 10px; background: var(--surface2); font-size: 13px; color: var(--ink); }
.wbattle:hover { text-decoration: none; outline: 1px solid var(--accent); }
.wbattle .mm { display: flex; }
.wtips { margin: 4px 0 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--gold) 12%, transparent); font-size: 14px; }
.wtips ul { margin: 0; padding-left: 18px; }
.wtoggle { display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 2px; font-size: 14px; cursor: pointer; user-select: none; }
.wtoggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.walk-hide-mons .wmons { display: none; }
.wmons { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--good) 35%, var(--line)); background: color-mix(in srgb, var(--good) 7%, var(--surface)); }
.wmons-h { font-family: var(--pixel); font-size: 14px; margin-bottom: 6px; }
.wmons-h .muted { white-space: nowrap; }
.tocd { margin: 8px 0 4px; }
.tocd > summary { cursor: pointer; font-size: 14px; color: var(--ink); padding: 4px 0; list-style-position: inside; }
.tocd[open] > summary { margin-bottom: 2px; }
.wm-row { display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; padding: 5px 0; border-top: 1px dashed var(--line); }
.wmons-h + .wm-row { border-top: 0; }
.wm-place { font-size: 13px; color: var(--muted); padding-top: 2px; }
.wm-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.wm-chips .chip { padding-left: 3px; }
.wm-chips .chip i { font-style: normal; font-size: 11px; color: var(--muted); }
.wm-sub { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 560px) { .wm-row { grid-template-columns: 1fr; gap: 2px; } }
/* page and section explanations behind an (i) button */
.itip { display: inline-flex; vertical-align: middle; margin-left: 8px; }
.itip-btn { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; color: var(--muted); font: italic 700 12px/1 Georgia, "Times New Roman", serif; cursor: pointer; display: grid; place-items: center; }
.itip-btn:hover, .itip.open .itip-btn { color: var(--accent); border-color: var(--accent); }
.itip-pop { position: fixed; z-index: 55; display: none; width: max-content; max-width: min(340px, calc(100vw - 16px)); padding: 10px 13px; border-radius: 10px; background: var(--ink); color: var(--bg); font: 400 13px/1.65 var(--sans); letter-spacing: 0; text-align: left; white-space: normal; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); }
.itip.open .itip-pop { display: block; }
.itip-pop b { font-weight: 700; }
/* hover cards */
.icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 6px; }
.icard { display: flex; flex-direction: column; gap: 6px; padding: 16px; color: var(--ink); min-height: 116px; transition: transform .12s, border-color .12s; }
.icard:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-2px); }
.icard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.icard-top b { font-family: var(--pixel); font-weight: normal; font-size: 16px; }
.icard-mons { display: flex; gap: 2px; margin-top: auto; }
.icard-extra { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
.icard-extra .chip .type { min-width: 0; font-size: 10px; line-height: 16px; padding: 0 5px; }
.swatches { display: flex; gap: 4px; }
@media (max-width: 560px) {
  .icards { grid-template-columns: 1fr 1fr; gap: 8px; }
  .icard { padding: 11px; min-height: 0; gap: 4px; }
  .icard-top { flex-direction: column; align-items: flex-start; gap: 3px; }
  .icard-top b { font-size: 14px; line-height: 1.3; }
  .icard .muted.small { font-size: 12px; line-height: 1.4; }
  .icard-mons .spr { zoom: .8; }
  .icard-extra .chip:nth-child(n+3) { display: none; }
  .swatches { gap: 2px; flex-wrap: wrap; }
  .swatches i { width: 12px; height: 12px; }
}
.swatches i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
.toc a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tip { position: fixed; z-index: 60; width: 300px; max-width: calc(100vw - 16px); padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 30px -10px rgba(0,0,0,.45); font-size: 13px; line-height: 1.5; pointer-events: none; display: none; }
.tip.on { display: block; }
.tip-h { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.tip-h b { font-family: var(--pixel); font-weight: normal; font-size: 15px; }
.tip-l { font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
.tip .st6 { margin: 4px 0 0; gap: 3px; }
.tip .st6 div { padding: 3px 1px; }
.tip .st6 div span { white-space: nowrap; font-size: 10px; letter-spacing: -.02em; }
.tip .chips { display: flex; flex-wrap: wrap; gap: 3px; }
.tip .chip { font-size: 11px; line-height: 18px; padding: 0 7px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <button class="back-btn" id="back" hidden aria-label="이전 페이지로"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>뒤로</button>
    <a class="brand" href="#/"><span class="ball"></span>암브로시아 위키</a>
    <nav class="main" id="nav">
      <a href="#/start" data-r="start">처음 시작</a>
      <a href="#/walk" data-r="walk">공략</a>
      <a href="#/dex" data-r="dex">도감</a>
      <a href="#/places" data-r="places">지역</a>
      <a href="#/train" data-r="train">육성</a>
      <a href="#/changes" data-r="changes">바뀐 점</a>
      <a href="#/info" data-r="info">자료실</a>
    </nav>
    <button class="theme-btn" id="theme" title="밝게/어둡게" aria-label="밝게/어둡게 전환">◐</button>
  </div>
</header>
<main class="wrap" id="app"><div class="loading">불러오는 중…</div></main>
<footer>
  <div class="wrap">
    포켓몬스터 암브로시아 v3.0.0 한글판 팬 위키. 모든 수치는 게임 소스에서 자동으로 뽑았습니다.
    포켓몬과 관련 이름·그림의 권리는 Nintendo · Creatures · GAME FREAK에 있습니다. 글꼴: 갈무리(SIL OFL 1.1).
  </div>
</footer>
<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let D, SP, G, AV, CMP, CMV = {}, W, WM, P = {}, M = {}, I = {}, T = {}, PL = {}, TY = {}, EFF = {}, LEARN = {}, PLACE_LIST = [];

// theme
const root = document.documentElement;
try { const t = localStorage.getItem('amb-theme'); if (t) root.dataset.theme = t; } catch (e) {}
const header = $('header.top');
const setHeadH = () => root.style.setProperty('--head-h', header.offsetHeight + 'px');
setHeadH();
addEventListener('resize', setHeadH);
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('amb-theme', root.dataset.theme); } catch (e) {}
};

// ---------- helpers ----------
function spr(key, z = 1, shiny = false) {
  const i = SP.index[key];
  if (i == null) return `<span class="spr" style="width:${56*z}px;height:${56*z}px"></span>`;
  const c = SP.cell * z, col = i % SP.cols, row = Math.floor(i / SP.cols);
  return `<span class="spr" style="width:${c}px;height:${c}px;background-image:url(${shiny ? 'sprites_shiny.png' : 'sprites.png'}?v=2);background-size:${SP.cols * c}px auto;background-position:${-col * c}px ${-row * c}px"></span>`;
}
const typeChip = (t, lg) => `<span class="type t-${t}${lg ? ' lg' : ''}">${esc(TY[t]?.ko ?? t)}</span>`;
const catChip = c => `<span class="cat cat-${c}">${esc(c)}</span>`;
const monLink = (key, z = .64) => { const p = P[key]; return p ? `<a class="monlink" href="#/p/${key}">${spr(key, z)}<span>${esc(p.ko)}</span></a>` : esc(key); };
const moveLink = k => M[k] ? `<a href="#/move/${k}">${esc(M[k].ko)}</a>` : esc(k);
const placeLink = (k, label) => PL[k] ? `<a href="#/place/${k}">${esc(label || PL[k].ko)}</a>` : esc(label || k);
const no3 = n => String(n).padStart(3, '0');
const norm = s => String(s || '').toLowerCase().replace(/[\s·.'’\-]/g, '');
const dash = v => (v == null || v === 0) ? '—' : v;
function statColor(v) { return v >= 120 ? '#3f9a5a' : v >= 90 ? '#7fae3a' : v >= 60 ? '#d6a627' : v >= 40 ? '#e0832f' : '#d0533a'; }
function setTitle(t) { document.title = t ? `${t} · 암브로시아 위키` : '암브로시아 한글 위키'; }
function defMult(atk, defs) { let m = 1; for (const d of defs) m *= (EFF[atk]?.[d] ?? 1); return atk === 'UBER' ? 1 : m; }

// ---------- views ----------
function viewHome() {
  setTitle('');
  const parade = ['TREECKO','CHIMCHAR','PIPLUP','PIKACHU','EEVEE','LUCARIO','GARCHOMP','GENGAR','DRAGONITE','TYRANITAR','MEW','RAYQUAZA','ARCEUS','MEWTWO','ABSOL','GARDEVOIR'].filter(k => P[k]);
  const c = D.meta.counts;
  return `
  <section class="welcome">
    <div class="card intro">
      <div class="px muted small">Pokémon Ambrosia v${esc(D.meta.version)} · 한글판</div>
      <h1>포켓몬스터 암브로시아<br>한글 위키</h1>
      <p>크리스탈을 바탕으로 완전히 새로 만든 롬핵 「암브로시아」의 한글판 공략 사전입니다. 호연과의 전쟁이 다가오는 성도·관동을 무대로, 1~6세대 포켓몬 ${c.pokemon}종과 새 타입 <span class="type t-UBER">우버</span>, 모든 포켓몬의 특성이 등장합니다.</p>
      <p class="muted small">이름은 공식 한국어명을 따랐고, 모든 수치는 게임 소스에서 직접 뽑았습니다.</p>
      <div class="parade">${parade.map(k => `<a href="#/p/${k}" title="${esc(P[k].ko)}">${spr(k, 1.1)}</a>`).join('')}</div>
    </div>
    <div class="card pad">
      <h3>처음이라면</h3>
      <ol class="steps">
        <li><div><b>원본 롬에 한글 패치 적용</b><span>「Pokémon Ambrosia (v3.0.0).gbc」에 .bps 패치를 Flips나 Rom Patcher JS로 적용합니다. 게임보이 컬러 전용이며 새 게임으로 시작하세요.</span>
          <span class="patch"><a class="patch-btn" href="${PATCH_URL}" target="_blank" rel="noopener">한글 패치 받기</a><span class="muted small">GitHub · zip 1.5MB · BPS·IPS 패치, Delta 스킨, 설명서</span></span></div></li>
        <li><div><b>처음 시작 가이드 읽기</b><span><a href="#/start">처음 시작 가이드</a>에 레벨 제한, 체육관 공략, 언제 어디서 잡는지까지 따진 추천 파티가 있습니다.</span></div></li>
        <li><div><b>막히면 여기서 찾기</b><span>아래 검색창에 포켓몬·기술·도구·장소·트레이너 이름을 넣어 보세요. 한글·영어 모두 됩니다.</span></div></li>
      </ol>
    </div>
  </section>
  <h2>찾아보기</h2>
  <input type="search" id="q" placeholder="예: 나무지기, 지진, 마스터볼, 금빛시티, 비상" autocomplete="off" style="width:100%">
  <div class="results" id="res"></div>
  <h2>둘러보기</h2>
  <div class="quick">
    <a href="#/start"><b>처음 시작 가이드</b><span>자주 묻는 질문 · 체육관 공략 · 추천 파티</span></a>
    <a href="#/walk"><b>공략</b><span>스토리 순서대로 따라가기</span></a>
    <a href="#/dex"><b>포켓몬 도감</b><span>${c.pokemon}종 · 특성 · 서식지</span></a>
    <a href="#/places"><b>지역</b><span>${c.places}곳 · 야생 포켓몬</span></a>
    <a href="#/train"><b>육성 가이드</b><span>개체값 · 노력치 · 특성 · 이로치</span></a>
    <a href="#/changes"><b>바뀐 점</b><span>게임 시스템 · 종족값 · 타입 · 기술</span></a>
    <a href="#/info"><b>자료실</b><span>기술 · 도구 · 트레이너 · 상성표 · 진화 방법 · 상점</span></a>
  </div>
  <h2>암브로시아는 무엇이 다른가요?</h2>
  <div class="features">${D.features.slice(0, 4).map(featureCard).join('')}</div>
  <p><a href="#/changes">바뀐 점 전체 보기 →</a></p>`;
}
// The patch lives in the wiki's GitHub repository; this name stays the same across releases.
const REPO_URL = 'https://github.com/Welcome-to-NYC/pokemon-ambrosia-ko';
const PATCH_URL = REPO_URL + '/releases/latest/download/Pokemon_Ambrosia_v3.0.0_KO_patch.zip';
const crumb = () => '<p class="crumb"><a href="#/info">자료실</a> ›</p>';
const featureCard = f => `<div class="card pad"><h3>${esc(f.title)}</h3><ul>${f.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
function bindHome() {
  const q = $('#q'), res = $('#res');
  const idx = [
    ...D.pokemon.map(p => ({ k: 'p', key: p.key, ko: p.ko, en: p.en, kind: '포켓몬' })),
    ...D.moves.map(m => ({ k: 'move', key: m.key, ko: m.ko, en: m.en, kind: '기술' })),
    ...D.items.map(i => ({ k: 'item', key: i.key, ko: i.ko, en: i.en, kind: '도구' })),
    ...PLACE_LIST.map(p => ({ k: 'place', key: p.key, ko: p.ko, en: p.en, kind: '장소' })),
    ...D.trainers.map(t => ({ k: 'trainer', key: t.key, ko: `${t.class_ko} ${t.name}`, en: `${t.class_en} ${t.name_en}`, kind: t.role || '트레이너' })),
  ].map(r => ({ ...r, n: norm(r.ko) + '|' + norm(r.en) }));
  q.oninput = () => {
    const s = norm(q.value);
    if (!s) { res.innerHTML = ''; return; }
    const hits = idx.filter(r => r.n.includes(s)).sort((a, b) => (norm(a.ko).startsWith(s) ? 0 : 1) - (norm(b.ko).startsWith(s) ? 0 : 1)).slice(0, 24);
    res.innerHTML = hits.length ? hits.map(r => {
      const href = r.k === 'item' ? `#/items?q=${encodeURIComponent(r.ko)}` : `#/${r.k}/${encodeURIComponent(r.key)}`;
      const icon = r.k === 'p' ? spr(r.key, .6) : r.k === 'move' ? typeChip(M[r.key].type) : '';
      return `<a href="${href}">${icon}<span>${esc(r.ko)} <span class="muted small">${esc(r.en)}</span></span><span class="kind">${esc(r.kind)}</span></a>`;
    }).join('') : '<div class="empty">찾는 결과가 없습니다.</div>';
  };
  q.focus({ preventScroll: true });
}

// dex
const dexState = { q: '', types: new Set(), sort: 'dex', stage: '', view: 'grid' };
try { if (localStorage.getItem('amb-dex-view') === 'detail') dexState.view = 'detail'; } catch (e) {}
// one Pokémon in the dex's detailed view: the 바뀐 점 card plus when it can be had
function dexDetail(p) {
  const same = !isChanged(p.key);
  const av = AV.pokemon[p.key];
  return `<div class="card chg"><a href="#/p/${p.key}">${spr(p.key, 1.25)}</a><div>
    <div><a class="nm" href="#/p/${p.key}">${esc(p.ko)}</a>${formTag(p.key)} <span class="muted small">${dexState.sort === 'no' ? 'No.' + no3(p.no) : '#' + no3(p.dex_order)} ${esc(p.en)}</span>
      ${same && CMP[p.key] && !CMP[p.key].custom ? '<span class="tag">종족값·타입 공식과 같음</span>' : ''}</div>
    ${changeBody(p.key)}
    ${av ? `<div class="lbl2">얻는 시기</div><div class="small">${stageChip(av.stage)} ${availHow(p.key)}</div>` : ''}
  </div></div>`;
}
function viewDex(params = {}) {
  if (params.stage != null) dexState.stage = params.stage;
  setTitle('포켓몬 도감');
  return `<h1>포켓몬 도감${itip('게임 속 도감과 같은 순서입니다.<br>「자세히」를 고르면 종족값·특성·얻는 시기를 한눈에 볼 수 있고, 포켓몬을 누르면 진화·서식지·배우는 기술까지 나옵니다.')}</h1>
  <div class="tools">
    <input type="search" id="dq" placeholder="이름으로 찾기 (한글/영어)" value="${esc(dexState.q)}">
    <select id="dsort" aria-label="정렬">
      <option value="dex">새 도감 순</option><option value="no">전국 번호 순</option>

function evoTree(key) {
  let rootKey = key, guard = 0;
  while (P[rootKey]?.evolves_from?.length && guard++ < 5) rootKey = P[rootKey].evolves_from[0];
  const node = k => `<a class="evo-node${k === key ? ' cur' : ''}" href="#/p/${k}">${spr(k, 1)}<span class="n">${esc(P[k]?.ko ?? k)}</span></a>`;
  const build = k => {
    const evs = (P[k]?.evolutions || []).filter(e => P[e.to]);
    if (!evs.length) return node(k);
    const branch = evs.map(e => `<div><span class="evo-arrow">${esc(e.method)}</span>${build(e.to)}</div>`).join('');
    return evs.length === 1 ? `${node(k)}<span class="evo-arrow">${esc(evs[0].method)}</span>${build(evs[0].to)}` : `${node(k)}<div class="evo-branch">${branch}</div>`;
  };
  return (P[rootKey]?.evolutions?.length) ? `<div class="evo">${build(rootKey)}</div>` : '<p class="muted">진화하지 않는 포켓몬입니다.</p>';
}

const HOW_TAG = { '주움': '주움', '숨겨진 도구': '숨김', '받음': '받음', '전화 선물': '전화' };
function wherePieces(i) {
  return [
    // shops first, then the field, then the occasional phone gift and New Game Plus stock
    ...(i.sold_at || []).map(w => `${esc(w)} <span class="tag gold">구입</span>`),
    ...(i.found_at || []).filter(f => f.how !== '전화 선물').map(f => `${placeLink(f.map, f.map_ko)} <span class="tag">${HOW_TAG[f.how] || esc(f.how)}</span>`),
    ...(i.found_at || []).filter(f => f.how === '전화 선물').map(f => `${placeLink(f.map, f.map_ko)} <span class="tag">전화</span>`),

  ];
}
function whereCell(i, open = 3) {

}

function availHow(key, withRoot = true) {

  const bits = [r.method + (r.level ? ` Lv${r.level}` : ''), r.time && r.time !== '종일' ? r.time : '', r.pct ? r.pct + '%' : '', r.note || ''].filter(Boolean).map(esc).join(' · ');

// ---------- (i) explanations ----------
const itip = text => `<span class="itip"><button class="itip-btn" type="button" aria-label="설명 보기" aria-expanded="false">i</button><span class="itip-pop" role="tooltip">${text}</span></span>`;
{
  const close = except => document.querySelectorAll('.itip.open').forEach(w => { if (w !== except) { w.classList.remove('open'); w.firstChild.setAttribute('aria-expanded', 'false'); } });
  const open = w => {
    close(w);
    w.classList.add('open'); w.firstChild.setAttribute('aria-expanded', 'true');
    const pop = w.querySelector('.itip-pop'), r = w.firstChild.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    const x = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - pw - 8));
    let y = r.bottom + 8;
    if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 8);
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  };
  document.addEventListener('click', e => {
    const w = e.target.closest('.itip');
    if (w && e.target.closest('.itip-btn')) { e.preventDefault(); w.classList.contains('open') ? close() : open(w); return; }
    if (!w) close();
  });
  if (matchMedia('(hover: hover)').matches) {
    document.addEventListener('mouseover', e => { const w = e.target.closest('.itip'); if (w && !w.classList.contains('open')) open(w); });
    document.addEventListener('mouseout', e => { const w = e.target.closest('.itip'); if (w && !w.contains(e.relatedTarget)) close(); });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  window.addEventListener('scroll', () => close(), { passive: true });
  window.addEventListener('hashchange', () => close());
}

// ---------- hover cards ----------
// Pokémon: types, stats against the official games, ability, moves the
// official games do not teach. Items: effect, price, where to get them.
function tipPokemon(k) {
  const p = P[k], c = CMP[k] || {};
  const st = STATS6.map(([s, l]) => { const d = c.stats ? p.stats[s] - c.stats[s] : 0; return `<div class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}"><span class="muted">${l}</span><b>${p.stats[s]}</b><i>${c.stats ? (d ? (d > 0 ? '+' : '') + d : '=') : ''}</i></div>`; }).join('');
  const moves = [...(c.custom_moves || []).map(m => ['own', m]), ...(c.new_level_moves || []).map(m => ['new', m]), ...(c.new_tm_moves || []).map(m => ['new', m])].filter(([, m]) => M[m]);
  const types = c.type_changed ? `<span class="strike">${c.types.map(t => typeChip(t)).join(' ')}</span> → ${p.types.map(t => typeChip(t)).join(' ')}` : p.types.map(t => typeChip(t)).join(' ');
  return `<div class="tip-h">${spr(k, .9)}<div><b>${esc(p.ko)}</b> <span class="muted small">#${no3(p.dex_order)}</span><div style="margin-top:2px">${types}</div></div></div>
    <div class="st6">${st}</div>
    <div class="tip-l">특성</div><div>${esc(p.dex_page2)}</div>
    ${moves.length ? `<div class="tip-l">공식 게임과 달리 배우는 기술 ${moves.length}개</div><div class="chips">${moves.slice(0, 12).map(([cls, m]) => `<span class="chip ${cls}">${esc(M[m].ko)}</span>`).join('')}${moves.length > 12 ? `<span class="muted small">외 ${moves.length - 12}개</span>` : ''}</div>` : ''}`;
}
function tipItem(k) {
  const i = I[k], w = wherePieces(i);
  return `<div class="tip-h"><b>${esc(i.ko)}</b><span class="tag">${esc(i.pocket)}</span>${i.price ? `<span class="muted small">₩${i.price.toLocaleString()}</span>` : ''}</div>
    <div>${esc(i.desc)}</div>
    ${w.length ? `<div class="tip-l">얻는 곳</div><div>${w.slice(0, 4).join('<br>')}${w.length > 4 ? `<br><span class="muted">그 밖에 ${w.length - 4}곳</span>` : ''}</div>` : ''}`;
}
// Mouse: the card follows the pointer. Touch: the first tap on a Pokémon or
// item shows its card, a second tap on it opens its page, a tap elsewhere
// closes the card.
{
  const tip = document.createElement('div');
  tip.className = 'tip';
  document.body.appendChild(tip);
  const touch = !matchMedia('(hover: hover)').matches;
  let cur = null;
  const hide = () => { cur = null; tip.classList.remove('on'); };
  const show = el => {
    const [kind, key] = el.dataset.tip.split(':');
    const html = kind === 'p' && P[key] ? tipPokemon(key) : kind === 'i' && I[key] ? tipItem(key) : '';
    if (!html) return false;
    cur = el;
    tip.innerHTML = html + (touch && el.closest('a[href]') ? '<div class="tip-l" style="margin-top:8px">한 번 더 누르면 페이지로 이동합니다</div>' : '');
    tip.classList.add('on');
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const x = Math.min(Math.max(8, r.left), innerWidth - tw - 8);
    let y = r.bottom + 6;
    if (y + th > innerHeight - 8) y = Math.max(8, r.top - th - 6);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
    return true;
  };
  if (touch) {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-tip]');
      if (!el) { if (cur) hide(); return; }
      if (el === cur) { hide(); return; } // second tap: let the link open
      if (show(el)) e.preventDefault();
    }, true);
  } else {
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-tip]');
      if (!el) { if (cur) hide(); return; }
      if (el !== cur && !show(el)) hide();
    });
  }
  window.addEventListener('scroll', () => { if (cur) hide(); }, { passive: true });
  window.addEventListener('hashchange', hide);
}

  const navEl = $('#nav'), onTab = $('#nav a.on');  // keep the current tab in view on phones
  if (onTab && navEl.scrollWidth > navEl.clientWidth) navEl.scrollLeft = onTab.offsetLeft - (navEl.clientWidth - onTab.offsetWidth) / 2;
  setHeadH();
  const views = {
    '': [viewHome, bindHome], start: [viewStart, bindStart], walk: [viewWalk, bindWalk], train: [viewTrain, bindStart], changes: [viewChanges, bindChanges], dex: [() => viewDex(params), bindDex], p: [() => viewMon(arg), () => bindMon(arg)],
    moves: [viewMoves, bindMoves], move: [() => viewMove(arg), () => {}], items: [() => viewItems(params), bindItems],
    trainers: [viewTrainers, bindTrainers], trainer: [() => viewTrainer(arg), () => {}], places: [viewPlaces, bindPlaces],
    place: [() => viewPlace(arg), bindRows], types: [viewTypes, () => {}], guide: [viewChanges, bindChanges],
    info: [() => viewInfo(arg), () => {}],
  };
  const v = views[r] || [notFound, () => {}];
  app.innerHTML = v[0]();
  if (r !== 'p' || P[arg]) v[1]();
}
// The wiki keeps its own page history: inside the artifact frame (and in the
// phone app) there is no browser back button. Each entry remembers where the
// page was scrolled, so going back lands where the reader left off.
let lastHash = '';
const trail = [];           // [{hash, y}] pages before this one
let skipTrail = false;
const home = h => !h || h === '#' || h === '#/';
const same = (a, b) => (home(a) && home(b)) || a === b;
const backBtn = $('#back');
const syncBack = () => { backBtn.hidden = home(location.hash); };
const PARENT = { p: '#/dex', move: '#/moves', trainer: '#/trainers', place: '#/places', moves: '#/info', items: '#/info', trainers: '#/info', types: '#/info', guide: '#/changes' };
backBtn.onclick = () => {
  if (trail.length) { location.hash = trail[trail.length - 1].hash || '#/'; return; }
  const r = location.hash.replace(/^#\/?/, '').split(/[/?]/)[0];
  skipTrail = true;
  location.hash = location.hash.startsWith('#/info/') ? '#/info' : (PARENT[r] || '#/');
};
window.addEventListener('hashchange', () => {
  const base = h => h.split('?')[0];
  let y = null;
  if (trail.length && same(location.hash, trail[trail.length - 1].hash)) {
    y = trail.pop().y;                       // back: our button or the browser's
  } else if (!skipTrail && !same(location.hash, lastHash)) {
    trail.push({ hash: lastHash, y: window.scrollY });
    if (trail.length > 60) trail.shift();
  }
  skipTrail = false;
  const sameList = base(location.hash) === base(lastHash) && !location.hash.includes('/p/');
  lastHash = location.hash;
  render();
  syncBack();
  if (y != null) window.scrollTo(0, y);      // render() is synchronous, so the page is laid out
  else if (!sameList) window.scrollTo(0, 0);
});

Promise.all(['data.json', 'sprites.json', 'guide.json', 'avail.json', 'compare.json', 'walkthrough.json', 'walk_mons.json'].map(f => fetch(f + '?v=22').then(r => r.ok ? r.json() : null))).then(([d, s, g, av, cmp, w, wm]) => {
  D = d; SP = s; G = g; AV = av; CMP = cmp.pokemon; CMV = cmp.moves || {}; W = w; WM = wm || {};
  D.pokemon.forEach(p => P[p.key] = p);
  D.moves.forEach(m => M[m.key] = m);
  D.items.forEach(i => I[i.key] = i);
  D.trainers.forEach(t => T[t.key] = t);
  D.types.forEach(t => TY[t.id] = t);
  D.type_chart.forEach(([a, b, m]) => (EFF[a] ||= {})[b] = m);
  for (const r of Object.keys(D.places)) for (const p of D.places[r]) { PL[p.key] = p; PLACE_LIST.push(p); }
  for (const p of D.pokemon) {
    for (const [l, k] of p.level_moves) { const L = (LEARN[k] ||= { lv: [], tm: [] }); if (!L.lv.some(x => x[0] === p.key)) L.lv.push([p.key, l <= 1 ? '기본' : 'Lv.' + l]); }
    for (const t of p.tm_moves) { const L = (LEARN[t.move] ||= { lv: [], tm: [] }); L.tm.push([p.key, '']); }
  }
  const ord = (a, b) => P[a[0]].dex_order - P[b[0]].dex_order;
  for (const k in LEARN) { LEARN[k].lv.sort(ord); LEARN[k].tm.sort(ord); }
  lastHash = location.hash;
  render();
  syncBack();
}).catch(e => { app.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다. (${esc(e.message)})</div>`; });
})();
